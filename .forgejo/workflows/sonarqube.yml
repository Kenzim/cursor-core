# SonarQube Server analysis for cursor-core.
#
# Required repository secrets (Forgejo → Settings → Actions → Secrets):
#   SONAR_HOST_URL  - base URL of your SonarQube server
#   SONAR_TOKEN     - project or global analysis token from SonarQube
#
# Dependency CVEs: OWASP Dependency-Check runs in this job before sonar-scanner.
# JSON+HTML are imported by sonar-dependency-check-plugin (More → Dependency-Check).
#
# Checkout uses the LAN Forgejo URL. Default https://git.stackken.com hairpins
# through the public IP and a rootless slirp4netns path.

name: SonarQube

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  sonarqube:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
      volumes:
        - /home/runner/.cache/dependency-check:/dependency-check-cache
        # Persist scanner engine + plugin JARs. Fresh containers otherwise
        # re-download ~50MB over HTTP/2 and hang on this slirp4netns runner.
        - /home/runner/.cache/sonar:/root/.sonar
    steps:
      # Full history from LAN Forgejo. Avoid actions/checkout: data.forgejo.org
      # TLS flakes (gnutls SNI) on this runner, and HTTPS git.stackken.com hairpins WAN.
      - name: Checkout
        id: checkout
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init
          git remote add origin "http://192.168.11.92:3000/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: bearer ${GIT_TOKEN}" \
            fetch --prune origin "+refs/heads/*:refs/remotes/origin/*" "+refs/tags/*:refs/tags/*"
          git checkout --force "${GITHUB_SHA}"
          git reset --hard "${GITHUB_SHA}"

      # Avoid actions/setup-python: data.forgejo.org TLS flakes (gnutls SNI)
      # on this rootless slirp4netns runner. Use the job image's Python in a venv.
      - name: Set up Python
        run: |
          set -eu
          if ! python3 -c 'import venv' 2>/dev/null; then
            apt-get update -qq
            apt-get install -y -qq python3 python3-venv python3-pip
          fi
          python3 --version
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" -m pip install --upgrade pip
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
          echo "PATH=${RUNNER_TEMP}/venv/bin:${PATH}" >> "${GITHUB_ENV}"

      - name: Validate Sonar secrets
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ] || [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "Missing SONAR_TOKEN or SONAR_HOST_URL repository secrets." >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Run tests with coverage
        id: tests
        timeout-minutes: 20
        continue-on-error: true
        run: |
          python3 -m pytest tests \
            --cov=cursor_core --cov-report=xml:coverage.xml -q

      # OWASP Dependency-Check: JSON+HTML for sonar-dependency-check-plugin.
      - name: OWASP Dependency-Check
        id: dependency-check
        if: steps.checkout.outcome == 'success'
        timeout-minutes: 15
        env:
          DC_VERSION: "12.1.0"
        run: |
          set -eu
          DC_BIN="/dependency-check-cache/tool/dependency-check/bin/dependency-check.sh"
          DC_DATA="/dependency-check-cache/data"
          mkdir -p "/dependency-check-cache/tool" "${DC_DATA}"

          # Tool zip is cached on the runner; OpenJDK is not. Always install Java.
          apt-get update -qq
          apt-get install -y -qq curl unzip ca-certificates openjdk-17-jre-headless

          if [ ! -x "${DC_BIN}" ]; then
            curl -fsSL "https://github.com/jeremylong/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip" \
              -o "${RUNNER_TEMP}/dependency-check.zip"
            rm -rf "/dependency-check-cache/tool"
            unzip -q "${RUNNER_TEMP}/dependency-check.zip" -d "/dependency-check-cache/tool"
            DC_BIN="/dependency-check-cache/tool/dependency-check/bin/dependency-check.sh"
          fi

          if [ -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java ]; then
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          else
            export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          fi
          export PATH="${JAVA_HOME}/bin:${PATH}"
          test -x "${JAVA_HOME}/bin/java"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME}/bin" >> "${GITHUB_PATH}"

          DC_ARGS=(
            --project "${GITHUB_REPOSITORY##*/}"
            --scan .
            --format JSON
            --format HTML
            --out .
            --data "${DC_DATA}"
            --disableOssIndex
            --exclude "**/tests/**"
            --exclude "**/.venv/**"
            --exclude "**/.git/**"
          )
          # Empty NVD cache cannot use --noupdate; later runs reuse the volume.
          if compgen -G "${DC_DATA}/*.mv.db" > /dev/null; then
            DC_ARGS+=(--noupdate)
          fi

          "${DC_BIN}" "${DC_ARGS[@]}"
          test -s dependency-check-report.json

      # Run sonar-scanner in the job container. SonarSource `uses:` actions are
      # node24/composite steps; act_runner polls pathcmd.txt via podman archive
      # and hits "context deadline exceeded" on long scans.
      - name: SonarQube Scan
        if: success() && steps.dependency-check.outcome == 'success'
        timeout-minutes: 25
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -eu
          SCANNER_VERSION=8.0.1.6346
          SCANNER_FLAVOR=linux-x64
          SCANNER_ZIP="sonar-scanner-cli-${SCANNER_VERSION}-${SCANNER_FLAVOR}.zip"
          SCANNER_ROOT="${RUNNER_TEMP}/sonar-scanner-${SCANNER_VERSION}-${SCANNER_FLAVOR}"
          SCANNER_BIN="${SCANNER_ROOT}/bin/sonar-scanner"

          if [ ! -x "${SCANNER_BIN}" ]; then
            apt-get update -qq
            apt-get install -y -qq curl unzip jq ca-certificates openjdk-17-jre-headless
            curl -fsSL \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${SCANNER_ZIP}" \
              -o "${RUNNER_TEMP}/${SCANNER_ZIP}"
            rm -rf "${SCANNER_ROOT}"
            unzip -q "${RUNNER_TEMP}/${SCANNER_ZIP}" -d "${RUNNER_TEMP}"
          fi

          # Scanner 8 tries to download a JRE from SonarQube and hangs on this
          # runner; pin the system JDK explicitly (do not use the scanner zip JRE).
          if [ -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java ]; then
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          else
            export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          fi
          export PATH="${JAVA_HOME}/bin:${PATH}"
          JAVA_EXE="$(command -v java)"

          # Prefetch engine + plugins over HTTP/1.1. Scanner 8's OkHttp HTTP/2
          # path through slirp4netns + WAN hairpin hangs or dies with PROTOCOL_ERROR.
          export SONAR_USER_HOME="${HOME}/.sonar"
          CACHE="${SONAR_USER_HOME}/cache"
          mkdir -p "${CACHE}"
          serverUrl="${SONAR_HOST_URL%/}"

          echo "Prefetching scanner engine over HTTP/1.1"
          engine_json="$(curl --http1.1 --retry 4 --retry-delay 2 --max-time 180 -fsSL \
            -u "${SONAR_TOKEN}:" "${serverUrl}/api/v2/analysis/engine")"
          engine_name="$(jq -r '.filename' <<< "${engine_json}")"
          engine_sha="$(jq -r '.sha256' <<< "${engine_json}")"
          engine_dir="${CACHE}/${engine_sha}"
          mkdir -p "${engine_dir}"
          if [ ! -f "${engine_dir}/${engine_name}" ]; then
            curl --http1.1 --retry 8 --retry-all-errors --retry-delay 3 \
              --max-time 300 --speed-limit 1000 --speed-time 45 -fL -C - \
              -u "${SONAR_TOKEN}:" -H "Accept: application/octet-stream" \
              "${serverUrl}/api/v2/analysis/engine" -o "${engine_dir}/${engine_name}.part"
            mv "${engine_dir}/${engine_name}.part" "${engine_dir}/${engine_name}"
          fi
          echo "Engine cached: ${engine_name}"

          plugins_tsv="$(curl --http1.1 --retry 4 --retry-delay 2 --max-time 60 -fsSL \
            -u "${SONAR_TOKEN}:" "${serverUrl}/api/plugins/installed" \
            | jq -r '.plugins[] | [.hash, .key] | @tsv')"
          while IFS=$'\t' read -r hash key; do
            dest="${CACHE}/${hash}/sonar-${key}-plugin.jar"
            mkdir -p "${CACHE}/${hash}"
            if [ ! -f "${dest}" ]; then
              echo "Prefetching plugin ${key}"
              curl --http1.1 --retry 8 --retry-all-errors --retry-delay 3 \
                --max-time 300 --speed-limit 1000 --speed-time 45 -fL -C - \
                -u "${SONAR_TOKEN}:" \
                "${serverUrl}/api/plugins/download?plugin=${key}" -o "${dest}.part" \
                || exit 1
              mv "${dest}.part" "${dest}"
            fi
          done <<< "${plugins_tsv}"
          echo "Plugin cache ready"

          SCANNER_ARGS=(
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.javaExePath="${JAVA_EXE}"
            -Dsonar.userHome="${SONAR_USER_HOME}"
            -Dsonar.host.url="${SONAR_HOST_URL}"
            -Dsonar.token="${SONAR_TOKEN}"
          )
          test -s dependency-check-report.json
          SCANNER_ARGS+=(-Dsonar.dependencyCheck.jsonReportPath=dependency-check-report.json)
          if [ -s dependency-check-report.html ]; then
            SCANNER_ARGS+=(-Dsonar.dependencyCheck.htmlReportPath=dependency-check-report.html)
          fi

          "${SCANNER_BIN}" "${SCANNER_ARGS[@]}"

      - name: SonarQube Quality Gate
        if: success()
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -eu
          metadataFile=".scannerwork/report-task.txt"
          pollingTimeoutSec=300

          if [ ! -f "${metadataFile}" ]; then
            echo "${metadataFile} does not exist." >&2
            exit 1
          fi

          serverUrl="${SONAR_HOST_URL%/}"
          ceTaskUrl="${serverUrl}/api$(sed -n 's/^ceTaskUrl=.*api//p' "${metadataFile}")"

          task="$(curl --location --location-trusted --max-redirs 10 --silent --fail --show-error \
            --user "${SONAR_TOKEN}:" "${ceTaskUrl}")"
          status="$(jq -r '.task.status' <<< "${task}")"
          endTime=$((SECONDS + pollingTimeoutSec))

          until [[ "${status}" != "PENDING" && "${status}" != "IN_PROGRESS" || ${SECONDS} -ge ${endTime} ]]; do
            printf '.'
            sleep 5
            task="$(curl --location --location-trusted --max-redirs 10 --silent --fail --show-error \
              --user "${SONAR_TOKEN}:" "${ceTaskUrl}")"
            status="$(jq -r '.task.status' <<< "${task}")"
          done
          printf '\n'

          if [[ "${status}" == "PENDING" || "${status}" == "IN_PROGRESS" ]]; then
            echo "Quality Gate polling timed out after ${pollingTimeoutSec}s." >&2
            exit 1
          fi
          if [[ "${status}" == "CANCELED" || "${status}" == "FAILED" ]]; then
            jq -r '.task.errorMessage // "Sonar background task failed."' <<< "${task}" >&2
            exit 1
          fi

          analysisId="$(jq -r '.task.analysisId' <<< "${task}")"
          qualityGateStatus="$(curl --location --location-trusted --max-redirs 10 --silent --fail --show-error \
            --user "${SONAR_TOKEN}:" \
            "${serverUrl}/api/qualitygates/project_status?analysisId=${analysisId}" \
            | jq -r '.projectStatus.status')"

          dashboardUrl="$(sed -n 's/dashboardUrl=\(.*\)/\1/p' "${metadataFile}")"
          echo "Dashboard: ${dashboardUrl}"

          case "${qualityGateStatus}" in
            OK) echo "Quality Gate PASSED." ;;
            WARN) echo "Quality Gate WARN." ;;
            ERROR)
              echo "Quality Gate FAILED." >&2
              exit 1
              ;;
            *)
              echo "Quality Gate not configured (status=${qualityGateStatus})." >&2
              exit 1
              ;;
          esac

      - name: Fail if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: |
          echo "Tests failed or timed out; Sonar scan was still attempted." >&2
          exit 1
