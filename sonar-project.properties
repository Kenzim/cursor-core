sonar.projectKey=kenzim_cursor-core
sonar.projectName=cursor-core
sonar.sourceEncoding=UTF-8

# Python + dependency manifests (plugin files issues onto pyproject.toml).
sonar.sources=src/cursor_core,pyproject.toml
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**

# Protocol field-number switches (wire/engine/models/framing) trip S3776
# without becoming easier to follow when split. Auth/client were refactored.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# OWASP Dependency-Check → sonar-dependency-check-plugin 6.0.0.
# JSON is required for issues/metrics; HTML enables More → Dependency-Check.
# The Forgejo job fails if JSON is empty, so these paths exist at scan time
# (a missing jsonReportPath hangs Community 26.6).
sonar.dependencyCheck.jsonReportPath=dependency-check-report.json
sonar.dependencyCheck.summarize=true
sonar.dependencyCheck.htmlReportPath=dependency-check-report.html
