sonar.projectKey=kenzim_cursor-core
sonar.projectName=cursor-core
sonar.sourceEncoding=UTF-8

sonar.sources=src/cursor_core
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**

# Do not set sonar.dependencyCheck.jsonReportPath. A missing path hangs
# Community 26.6, and importing CVEs fails the quality gate (new_violations=0).
