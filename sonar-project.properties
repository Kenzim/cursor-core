sonar.projectKey=kenzim_cursor-core
sonar.projectName=cursor-core
sonar.sourceEncoding=UTF-8

sonar.sources=src/cursor_core
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**

# Protocol field-number switches (wire/engine/models/framing) trip S3776
# without becoming easier to follow when split. Auth/client were refactored.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# Do not set sonar.dependencyCheck.jsonReportPath. A missing path hangs
# Community 26.6, and importing CVEs fails the quality gate (new_violations=0).
