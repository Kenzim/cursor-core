[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cursor-core"
version = "0.1.0"
description = "Unofficial Cursor AgentService/Run HTTP/2 client (Connect-RPC, agent.v1)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "h2",
    "httpx",
    "certifi",
    "protobuf>=5.29,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Kenzim/cursor-core"
Repository = "https://git.stackken.com/kenzim/cursor-core"

[tool.hatch.build.targets.wheel]
packages = ["src/cursor_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/cursor_core/py.typed" = "cursor_core/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/src/cursor_core",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/sonar-project.properties",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src/cursor_core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["cursor_core"]
